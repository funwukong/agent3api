name: 🐞 故障报告
description: 网关转发失败 / 报错、账号登录不上、模型拿不到、界面异常等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 填之前先看三眼

        下面所有字段都是**选填**，但填得越全，能直接动手修的概率越高。

        - **标题写成「谁 + 什么现象」**，例如「ZCode 国际版：转发返回 401，官方客户端正常」。
          只写「XX 报错 401」的话，看的人连是哪一家、哪条链路都判断不了。
        - **一条 issue 只报一件事**，两个不相干的问题请分开提。
        - **凭证一律打码**：access token、JWT、Cookie、refresh token、API Key 都不要贴。
          网关存的报文里请求头会自动脱敏，但**请求体与响应体是原样保存的**，可能带你的对话内容，贴之前自己过一眼。

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 「设置 → 关于」里的版本号，或安装包文件名里的版本
      placeholder: 2.7.9

  - type: input
    id: provider
    attributes:
      label: 哪一家 / 哪个地区版本
      description: 照抄「添加账号」里那一项的原名（例如 ZCode 国际版）；拿不准就写你装的那个客户端叫什么
      placeholder: ZCode 国际版

  - type: dropdown
    id: upstream_ok
    attributes:
      label: 同一时间，这一家的官方客户端能正常用吗？
      description: 这条决定了是「上游改了协议」还是「网关自己的问题」
      options:
        - 能，官方客户端一切正常，只有走网关报错
        - 不能，官方客户端也报错 / 登不上 / 提示额度或风控
        - 没试过，手上没装这个客户端

  - type: textarea
    id: what-happened
    attributes:
      label: 你做了什么，看到什么
      description: |
        报错原文请用三个反引号包起来，免得被 Markdown 吃掉格式：

        ```
        像这样
        ```

        最有用的一份是上游原始报文，取法是：设置 → 打开「保存上游原始报文（请求头、请求体、响应头、响应体）」→
        再复现一次 → 请求日志页点那行的「详情」→「原始报文」标签 → 复制过来。
        注意这个开关只记录**开启之后新发生**的请求，且只保留最近 500 条。
      placeholder: |
        1. 账号页「添加账号」→ 粘贴凭证 → 模型页启用模型 → 客户端发一句「你好」
        2. 返回 401，每次必现

        ```
        把报错原文贴在这里
        ```

  - type: textarea
    id: extra
    attributes:
      label: 其它补充
      description: 截图、你用什么客户端调网关、已经试过什么、什么情况下反而是好的
