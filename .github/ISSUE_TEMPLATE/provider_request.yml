name: ➕ 新增提供商 / 模型支持
description: 希望接入某家新的客户端，或某个模型现在拿不到
title: "[提供商] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ### 先说清楚能接什么、不能接什么

        本项目是把**桌面 / CLI 客户端的登录态**包装成本地 OpenAI 兼容接口，所以能接的前提大致是：
        这家有一个能装在你机器上的客户端，且它自己发出去的请求可以被本地程序复刻。

        - **纯开放平台（只认 API Key）的服务不用在这里提** —— 添加自定义提供商，把 Base URL 填上就能用。
        - **纯网页版、没有本地客户端的**，基本接不了，因为拿不到可复刻的请求形态。
        - 上游改协议随时可能让某一家失效，接进来不等于长期可用。

        下面所有字段都是**选填**，但填得越全，越容易判断值不值得接。

  - type: input
    id: provider
    attributes:
      label: 哪一家 / 哪个客户端
      placeholder: 有道龙虾（桌面端）

  - type: input
    id: site
    attributes:
      label: 官网 / 下载地址
      placeholder: https://...

  - type: dropdown
    id: region
    attributes:
      label: 地区版本
      options:
        - 只有国内版
        - 只有国际版
        - 国内版和国际版都要
        - 不确定

  - type: dropdown
    id: auth
    attributes:
      label: 它是怎么登录的（可多选）
      multiple: true
      options:
        - 手机号 + 验证码
        - 邮箱 / 网页 OAuth 登录
        - 账号密码
        - 设备码 / 扫码
        - 只认 API Key（开放平台）
        - 不清楚

  - type: textarea
    id: notes
    attributes:
      label: 其它信息
      description: 抓包线索、官方文档链接、额度说明、你手上有没有可用的测试账号，都放这里
